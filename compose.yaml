services:
  folio:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: 25
      CONVERSION_CONCURRENCY: 2
      MAX_PENDING_JOBS: 20
      MAX_STORED_JOBS: 200
      FILE_RETENTION_HOURS: 1
      CONVERSION_TIMEOUT_SECONDS: 120
      TRUST_PROXY_HOPS: 0
    volumes:
      - folio-data:/app/data
    tmpfs:
      - /tmp:rw,nosuid,size=134217728,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  folio-data:
