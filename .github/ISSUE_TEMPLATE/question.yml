name: Question
description: Ask for setup or usage help.
title: "[Question]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and what you tried
      description: Include commit/version and deployment method. Redact sensitive details.
    validations:
      required: true
