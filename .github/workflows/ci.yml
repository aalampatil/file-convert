name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      REQUIRE_OFFICE: 1
      REQUIRE_PDF_LAYOUT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu-core
      - run: npm ci
      - run: python3 -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      REQUIRE_OFFICE: 1
      REQUIRE_PDF_LAYOUT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu-core
      - run: npm ci
      - run: python3 -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements.txt
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
          retention-days: 7
